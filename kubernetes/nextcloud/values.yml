persistence:
  enabled: true
  storageClass: csi-cinder-high-speed
  size: 1Gi

nextcloud:
  host: drive.tdr2d.com
  existingSecret:
      enabled: true
      secretName: nextcloud-env
      usernameKey: username
      passwordKey: password
      tokenKey: token
    
  objectStore:
    s3:
      enabled: true
      ssl: true
      prefix: drive/
      port: 443
      region: gra
      existingSecret: nextcloud-env
      secretKeys:
        host: s3_host
        accessKey: s3_access_key 
        secretKey: s3_secret_key
        bucket: s3_bucket 
        sse_c_key: s3_sse_c_key 

  defaultConfigs:
    s3.config.php: true